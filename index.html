<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Fan Controller</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 580px; display: flex; flex-direction: column; gap: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.5px; }
    .badge { padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
    .badge-offline { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .badge-online { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .indicator { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
    .card-title { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 14px; }

    .telemetry-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .stat-box { background: rgba(15, 23, 42, 0.5); padding: 14px; border-radius: 10px; border: 1px solid var(--border); }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); }
    .stat-value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }

    .mode-switch { display: flex; background: rgba(15, 23, 42, 0.6); padding: 4px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 18px; }
    .mode-btn { flex: 1; border: none; background: transparent; color: var(--text-muted); padding: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.2s ease; }
    .mode-btn.active { background: var(--accent); color: #000; box-shadow: 0 2px 8px rgba(56, 189, 248, 0.3); }

    .slider-container { display: flex; flex-direction: column; gap: 8px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); }
    input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; height: 6px; }
    input[type=range]:disabled { opacity: 0.35; cursor: not-allowed; }

    .warning-bar { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: var(--danger); padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; display: none; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Smart Fan System</h1>
    <span id="connStatus" class="badge badge-offline"><span class="indicator"></span> Disconnected</span>
  </header>

  <!-- Live Telemetry Card -->
  <div class="card">
    <div class="card-title">Live Sensor Data</div>
    <div class="telemetry-grid">
      <div class="stat-box">
        <div class="stat-label">Temperature</div>
        <div class="stat-value" id="valTemp">--.- &deg;C</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Air Pollution</div>
        <div class="stat-value" id="valAir">-- %</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Fan PWM Speed</div>
        <div class="stat-value" id="valSpeed">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">System Mode</div>
        <div class="stat-value" id="valMode" style="color: var(--accent);">AUTO</div>
      </div>
    </div>
    <div id="alarmBanner" class="warning-bar">Over-Temperature Alarm Triggered (&ge; 30&deg;C)</div>
  </div>

  <!-- Fan Control Card -->
  <div class="card">
    <div class="card-title">Fan Control</div>
    <div class="mode-switch">
      <button id="btnAuto" class="mode-btn active" onclick="setMode('AUTO')">Automatic</button>
      <button id="btnManual" class="mode-btn" onclick="setMode('MANUAL')">Manual</button>
    </div>

    <div class="slider-container">
      <div class="slider-header">
        <span>Manual Speed Adjust</span>
        <span id="speedDisplay">0 / 255</span>
      </div>
      <input type="range" id="speedSlider" min="0" max="255" value="0" disabled oninput="onSliderInput(this.value)" onchange="sendManualSpeed(this.value)">
    </div>
  </div>
</div>

<script>
  // MUST match the topics in your ESP32 code!
  const TOPIC_STATUS = "smartfan/DEVICE123/status";
  const TOPIC_SET    = "smartfan/DEVICE123/set";

  let client = null;
  let activeMode = "AUTO";

  function initMQTT() {
    const brokerUrl = "wss://broker.emqx.io:8084/mqtt";
    const clientId = "WebClient-" + Math.random().toString(16).substr(2, 8);

    client = mqtt.connect(brokerUrl, {
      clientId: clientId,
      clean: true,
      connectTimeout: 4000
    });

    const statusBadge = document.getElementById("connStatus");

    client.on("connect", () => {
      statusBadge.className = "badge badge-online";
      statusBadge.innerHTML = '<span class="indicator"></span> Connected';
      client.subscribe(TOPIC_STATUS);
    });

    client.on("error", () => {
      statusBadge.className = "badge badge-offline";
      statusBadge.innerHTML = '<span class="indicator"></span> Error';
    });

    client.on("offline", () => {
      statusBadge.className = "badge badge-offline";
      statusBadge.innerHTML = '<span class="indicator"></span> Disconnected';
    });

    client.on("message", (topic, payload) => {
      if (topic === TOPIC_STATUS) {
        try {
          const data = JSON.parse(payload.toString());
          updateUI(data);
        } catch (e) {
          console.error("Invalid JSON:", e);
        }
      }
    });
  }

  function updateUI(data) {
    document.getElementById("valTemp").innerHTML = `${data.temp} &deg;C`;
    document.getElementById("valAir").innerText = `${data.air} %`;
    document.getElementById("valSpeed").innerText = `${data.speed} (${Math.round((data.speed/255)*100)}%)`;
    document.getElementById("valMode").innerText = data.mode;

    // Toggle alarm banner
    document.getElementById("alarmBanner").style.display = data.alarm ? "block" : "none";

    // Synchronize UI mode state with actual device state
    if (data.mode !== activeMode) {
      applyModeUI(data.mode);
    }
  }

  function setMode(mode) {
    applyModeUI(mode);
    const payload = JSON.stringify({ mode: mode });
    client.publish(TOPIC_SET, payload);
  }

  function applyModeUI(mode) {
    activeMode = mode;
    const btnAuto = document.getElementById("btnAuto");
    const btnManual = document.getElementById("btnManual");
    const slider = document.getElementById("speedSlider");

    if (mode === "AUTO") {
      btnAuto.classList.add("active");
      btnManual.classList.remove("active");
      slider.disabled = true;
    } else {
      btnManual.classList.add("active");
      btnAuto.classList.remove("active");
      slider.disabled = false;
    }
  }

  function onSliderInput(val) {
    document.getElementById("speedDisplay").innerText = `${val} / 255 (${Math.round((val/255)*100)}%)`;
  }

  function sendManualSpeed(val) {
    if (activeMode !== "MANUAL") return;
    const payload = JSON.stringify({ mode: "MANUAL", speed: parseInt(val, 10) });
    client.publish(TOPIC_SET, payload);
  }

  window.addEventListener("DOMContentLoaded", initMQTT);
</script>
</body>
</html>
